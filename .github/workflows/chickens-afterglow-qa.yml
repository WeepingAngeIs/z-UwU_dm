name: Frozen chicken JAR – two players, shader comparison and reload
on:
  push:
    branches: ['qa/chickens-afterglow-20261124']
permissions: {contents: read, actions: read}
concurrency: {group: chickens-afterglow-qa, cancel-in-progress: false}
jobs:
  check:
    if: github.repository == 'WeepingAngeIs/z-UwU_dm' && github.event.repository.private == false && github.ref == 'refs/heads/qa/chickens-afterglow-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      UWU_EXPECTED_JAR_SHA256: 2384b5e7edc6e2f992c851f0b4b5a82a5581e6dbe502c5d522d973302252c83f
      UWU_JAR: ${{ github.workspace }}/build/chicken-candidate/UwU-Dimension-1.21.1-TEST-native-chickens-c71c9afe351d.jar
      UWU_SHADER_ZIP: ${{ github.workspace }}/build/shader/UwU Afterglow.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Verify the product source is exactly the sealed chicken revision
        run: git diff --exit-code c71c9afe351db06400a0f5def2c7386a7276b748 HEAD -- . ':(exclude)chicken-check' ':(exclude).github/workflows/chickens-afterglow-qa.yml'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: '14959587709'
          run-id: '45477138893'
          github-token: ${{ github.token }}
          path: build/chicken-candidate
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: '14961057991'
          run-id: '45479381005'
          github-token: ${{ github.token }}
          path: build/shader
          merge-multiple: true
          digest-mismatch: error
      - name: Check the two frozen artifacts in Minecraft on this runner
        id: pair
        run: |
          bash weapon-release/bootstrap.sh
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null || ! dpkg-query -W libgl1-mesa-dri libopenal1 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb xauth libgl1-mesa-dri libopenal1
          fi
          bash chicken-check/run.sh
      - name: Isolate a graphics-loader failure by running the same JAR without rendering mods
        if: failure() && steps.pair.outcome == 'failure'
        run: |
          if ! grep -Eiq 'NoClassDefFoundError.*(sodium|iris)|wrong shader pipeline|failed to create shader rendering pipeline|ShaderCompileException|Failed to process ConstDirective' build/chickens/*.log; then exit 0; fi
          mv build/chickens build/chickens-with-renderer
          mv build/chicken-deps build/chicken-renderer-deps
          env -u UWU_SHADER_ZIP bash chicken-check/run.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: chicken-afterglow-game-evidence-${{ github.sha }}
          path: |
            build/chickens/control/
            build/chickens/evidence/
            build/chickens/*.log
            build/chickens/*/crash-reports/
            build/chickens-with-renderer/*.log
            build/chickens-with-renderer/evidence/
          if-no-files-found: warn
          retention-days: 7
