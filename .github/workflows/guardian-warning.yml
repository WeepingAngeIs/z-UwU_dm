name: Guardian player warning
on:
  push:
    branches: ['codex/guardian-warning-playtest9']
permissions:
  contents: read
jobs:
  warning:
    if: github.repository == 'WeepingAngeIs/z-UwU_dm' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UWU_JAR: build/libs/UwU-Dimension-1.21.1-1.5.0-beta.13-combined-rc.2-playtest.9-integrated.1.jar
      UWU_GUARDIAN_WARNING_CHECK: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
      - name: Build the packaged Guardian change
        run: |
          bash gradlew --no-daemon --max-workers=2 jar
          echo "UWU_EXPECTED_JAR_SHA256=$(sha256sum "$UWU_JAR" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Prepare the hosted client display
        run: |
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null || ! dpkg-query -W libgl1-mesa-dri libopenal1 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb xauth libgl1-mesa-dri libopenal1
          fi
      - name: Play both warnings, measure the toss and check independent players
        run: bash lotus-client-check/run.sh
