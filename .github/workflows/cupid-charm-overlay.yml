name: Cupid charm overlay preview
on:
  push:
    branches: ['codex/integration/cupid-charm-overlay']
permissions:
  contents: read
jobs:
  preview:
    if: github.repository == 'WeepingAngeIs/z-UwU_dm' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UWU_CHARM_OVERLAY_CHECK: 'true'
      UWU_JAR: build/libs/UwU-Dimension-1.21.1-1.5.0-beta.13-combined-rc.2-playtest.9-integrated.1.jar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
      - name: Build the isolated preview source
        run: |
          bash integration-check/bootstrap.sh
          bash ./gradlew --no-daemon --no-build-cache --max-workers=2 jar
          echo "UWU_EXPECTED_JAR_SHA256=$(sha256sum "$UWU_JAR" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Capture the actual charm overlay in a disposable client
        run: |
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null || ! dpkg-query -W libgl1-mesa-dri libopenal1 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb xauth libgl1-mesa-dri libopenal1
          fi
          bash lotus-client-check/run.sh
      - name: Preserve rendered preview frames
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cupid-charm-overlay-preview
          path: build/charm-overlay-evidence/*.png
          if-no-files-found: error
          retention-days: 7
