name: Village professions and Guardian escorts
on:
  push:
    branches: ['codex/village-profession-courts']
permissions:
  contents: read
concurrency:
  group: village-professions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    if: github.repository == 'WeepingAngeIs/z-UwU_dm' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        seed: [152045, 20261121]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with: {distribution: temurin, java-version: '21'}
      - name: Prepare disposable test inputs
        run: |
          bash weapon-release/bootstrap.sh
          bash gradlew --no-daemon --max-workers=2 -I village-profession-check/probe.gradle jar professionProbeJar
      - name: Generate villages, cook native produce and exercise the escort
        run: bash village-profession-check/run.sh ${{ matrix.seed }}
      - name: Inspect the leafy pick on both Guardian colorways
        if: matrix.seed == 152045 && !cancelled()
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y xvfb xauth libgl1-mesa-dri libopenal1
          fi
          bash village-profession-check/gallery.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: village-profession-evidence-${{ matrix.seed }}-${{ github.sha }}
          path: build/profession-evidence
          if-no-files-found: ignore
          retention-days: 7
