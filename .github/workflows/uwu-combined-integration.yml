name: UwU combined Playtest 9 integration
on:
  push:
    branches: ['codex/integration/playtest9-combined-805cfd', 'codex/weapons/playtest9-side-chakram-805cfd']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: uwu-combined-playtest9-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'WeepingAngeIs/z-UwU_dm' && github.event.repository.private == false && github.ref_name != 'codex/weapons/playtest9-side-chakram-805cfd'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      VERSION: '1.5.0-beta.13-combined-rc.2-playtest.9-integrated.1'
      UWU_JAR: build/combined-candidate/UwU-Dimension-1.21.1-1.5.0-beta.13-combined-rc.2-playtest.9-integrated.1.jar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
      - name: Bootstrap the pinned Gradle distribution and official Maven fallback
        run: bash integration-check/bootstrap.sh
      - name: Recover the verified Playtest 9 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash fallback-check/recover-baseline.sh
      - name: Build once and freeze the combined candidate
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base 9b1d9fdffd5e385ae4f18f8e49e05559679ec306 c7f3026cec0f673c7b9eb45a39d26f880283f912)" = e16af6a2a1a00cb68291b6c9611d4604a0b20171
          bash ./gradlew --no-daemon --no-build-cache --max-workers=2 jar
          mkdir -p build/combined-candidate build/integration-check
          cp "build/libs/UwU-Dimension-1.21.1-$VERSION.jar" "$UWU_JAR"
          # Native fixtures replace disposable copies between candidate/baseline stages.
          # Preserve their writable-copy contract; pin the candidate bytes by SHA-256.
          chmod 644 "$UWU_JAR"
          sha256sum "$UWU_JAR" > build/integration-check/candidate.sha256
          echo "UWU_EXPECTED_JAR_SHA256=$(cut -d' ' -f1 build/integration-check/candidate.sha256)" >> "$GITHUB_ENV"
      - name: Verify both complete deltas and preserved packaged content
        run: python3 integration-check/verify.py "$UWU_JAR" "$RUNNER_TEMP/playtest-9.jar" --classes build/classes/java/main
      - name: Prepare the disposable hosted client display
        run: |
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null || ! dpkg-query -W libgl1-mesa-dri libopenal1 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb xauth libgl1-mesa-dri libopenal1
          fi
      - name: Check berry tip and body harvesting, vanilla controls and cave flora
        env:
          UWU_CAVE_CLIENT_CHECK: 'true'
        run: |
          sha256sum --check build/integration-check/candidate.sha256
          bash lotus-client-check/run.sh
          sha256sum --check build/integration-check/candidate.sha256
      - name: Render detailed bow, held scale, book opening and first manual page turn
        env:
          UWU_CUPID_LANTERN_CHECK: 'true'
        run: |
          sha256sum --check build/integration-check/candidate.sha256
          bash lotus-client-check/run.sh
          sha256sum --check build/integration-check/candidate.sha256
      - name: Check new Dusk placement and old Playtest 9 sites and residents
        run: |
          sha256sum --check build/integration-check/candidate.sha256
          bash dusk-check/run-server.sh "$UWU_JAR" "$RUNNER_TEMP/playtest-9.jar"
          sha256sum --check build/integration-check/candidate.sha256
      - name: Check shrine chunk orders, persistence and Dusk exclusion
        env:
          UWU_SHRINE_ORDERS_ONLY: 'true'
        run: |
          sha256sum --check build/integration-check/candidate.sha256
          bash shrine-check/run-server.sh "$UWU_JAR"
          sha256sum --check build/integration-check/candidate.sha256
      - name: Check all three waterfalls on fresh native terrain
        run: |
          sha256sum --check build/integration-check/candidate.sha256
          bash waterfall-check/run.sh "$UWU_JAR"
          sha256sum --check build/integration-check/candidate.sha256
      - name: Record exact combined validation provenance
        id: packet
        run: |
          python3 integration-check/verify.py "$UWU_JAR" "$RUNNER_TEMP/playtest-9.jar" --classes build/classes/java/main
          python3 integration-check/provenance.py "$UWU_JAR" "$RUNNER_TEMP/playtest-9.jar"
          echo "sha=$UWU_EXPECTED_JAR_SHA256" >> "$GITHUB_OUTPUT"
      - name: Return the exact passing combined JAR
        id: deliver
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ env.UWU_JAR }}
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Verify uploaded artifact identity
        env:
          EXPECTED_SHA: ${{ steps.packet.outputs.sha }}
          UPLOADED_SHA: ${{ steps.deliver.outputs.artifact-digest }}
        run: |
          test "$EXPECTED_SHA" = "${UPLOADED_SHA#sha256:}"
          echo "Combined source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Combined JAR SHA256: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve combined evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: uwu-combined-playtest9-evidence
          path: |
            build/integration-check/
            build/cupid-lantern-evidence/
            build/cupid-lantern-client.log
            build/cupid-lantern-client/crash-reports/
            build/cave-client.log
            build/cave-client/cave-flora-palette.png
            build/cave-client/cave-flora-palette.txt
            build/cave-client/crash-reports/
            build/dusk-check/*.log
            build/dusk-check/*.json
            build/shrine-check/*.log
            build/waterfall-check/*.log
          retention-days: 7
          if-no-files-found: warn
  weapons:
    if: github.repository == 'WeepingAngeIs/z-UwU_dm' && github.event.repository.private == false && github.ref_name == 'codex/weapons/playtest9-side-chakram-805cfd'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      VERSION: '1.5.0-beta.13-combined-rc.2-playtest.9-integrated.1-weapons.1'
      UWU_WEAPON_BASELINE: 'false'
      UWU_JAR: build/weapon-candidate/UwU-Dimension-1.21.1-1.5.0-beta.13-combined-rc.2-playtest.9-integrated.1-weapons.1.jar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
      - name: Bootstrap the pinned hosted build tools
        run: bash weapon-release/bootstrap.sh
      - name: Recover exact integrated and original Playtest 9 reference JARs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash weapon-release/recover-baseline.sh
          bash fallback-check/recover-baseline.sh
          printf '%s  %s\n' 7e402979865fa5e56edc5f24d26fff9704e99fa53b9f821b8e074241bb4cd9d8 "$RUNNER_TEMP/playtest-9.jar" | sha256sum --check
      - name: Build once and freeze the weapon candidate
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash ./gradlew --no-daemon --no-build-cache --max-workers=2 jar
          mkdir -p build/weapon-candidate build/weapon-release
          cp "build/libs/UwU-Dimension-1.21.1-$VERSION.jar" "$UWU_JAR"
          chmod 644 "$UWU_JAR"
          sha256sum "$UWU_JAR" > build/weapon-release/candidate.sha256
          echo "UWU_EXPECTED_JAR_SHA256=$(cut -d' ' -f1 build/weapon-release/candidate.sha256)" >> "$GITHUB_ENV"
      - name: Verify weapon-only source scope and preserved integrated content
        run: |
          python3 weapon-release/final_verify.py
          python3 weapon-audit/verify_geometry.py
      - name: Prepare the disposable hosted displays
        run: |
          free -m
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null || ! dpkg-query -W libgl1-mesa-dri libopenal1 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb xauth libgl1-mesa-dri libopenal1
          fi
      - name: Render every weapon and verify chakram motion with two real clients
        run: |
          sha256sum --check build/weapon-release/candidate.sha256
          bash weapon-check/run.sh
          sha256sum --check build/weapon-release/candidate.sha256
      - name: Preserve berry tip and body harvest, vanilla controls and cave flora
        env:
          UWU_CAVE_CLIENT_CHECK: 'true'
        run: |
          sha256sum --check build/weapon-release/candidate.sha256
          bash lotus-client-check/run.sh
          sha256sum --check build/weapon-release/candidate.sha256
      - name: Preserve detailed Cupid, held scale, book opening and first manual page turn
        env:
          UWU_CUPID_LANTERN_CHECK: 'true'
        run: |
          sha256sum --check build/weapon-release/candidate.sha256
          bash lotus-client-check/run.sh
          sha256sum --check build/weapon-release/candidate.sha256
      - name: Preserve Dusk fresh placement and original sites and residents
        run: |
          sha256sum --check build/weapon-release/candidate.sha256
          bash dusk-check/run-server.sh "$UWU_JAR" "$RUNNER_TEMP/playtest-9.jar"
          sha256sum --check build/weapon-release/candidate.sha256
      - name: Preserve shrine chunk orders, persistence and Dusk exclusion
        env:
          UWU_SHRINE_ORDERS_ONLY: 'true'
        run: |
          sha256sum --check build/weapon-release/candidate.sha256
          bash shrine-check/run-server.sh "$UWU_JAR"
          sha256sum --check build/weapon-release/candidate.sha256
      - name: Preserve all three waterfalls on fresh native terrain
        run: |
          sha256sum --check build/weapon-release/candidate.sha256
          bash waterfall-check/run.sh "$UWU_JAR"
          sha256sum --check build/weapon-release/candidate.sha256
      - name: Record exact candidate and all hosted visual evidence
        id: packet
        run: |
          python3 weapon-release/final_verify.py
          python3 weapon-release/collect.py
          echo "sha=$UWU_EXPECTED_JAR_SHA256" >> "$GITHUB_OUTPUT"
      - name: Return the exact passing weapon JAR
        id: deliver
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ env.UWU_JAR }}
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Verify uploaded candidate identity
        env:
          EXPECTED_SHA: ${{ steps.packet.outputs.sha }}
          UPLOADED_SHA: ${{ steps.deliver.outputs.artifact-digest }}
        run: test "$EXPECTED_SHA" = "${UPLOADED_SHA#sha256:}"
      - name: Preserve actual frames, network observations and regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: uwu-weapon-verified-evidence
          path: |
            build/weapon-release/
            build/weapon-check/evidence/
            build/weapon-check/*.log
            build/weapon-check/host/crash-reports/
            build/weapon-check/observer/crash-reports/
            build/weapon-deps/dependencies.sha256
            build/cupid-lantern-evidence/
            build/cupid-lantern-client.log
            build/cupid-lantern-client/crash-reports/
            build/cave-client.log
            build/cave-client/cave-flora-palette.png
            build/cave-client/cave-flora-palette.txt
            build/cave-client/crash-reports/
            build/dusk-check/*.log
            build/dusk-check/*.json
            build/shrine-check/*.log
            build/waterfall-check/*.log
          retention-days: 7
          if-no-files-found: warn
