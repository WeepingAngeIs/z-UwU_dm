name: Verify Sakura Reach village house counts
on:
  push:
    branches: ['codex/village-house-counts']
permissions:
  contents: read
  actions: read
jobs:
  package:
    if: github.repository == 'WeepingAngeIs/z-UwU_dm' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with: {distribution: temurin, java-version: '21'}
      - name: Build candidate and separate native verifier
        run: |
          bash weapon-release/bootstrap.sh
          bash gradlew --no-daemon --max-workers=2 -I village-size-check/probe.gradle jar villageSizeProbeJar
      - name: Compare with the exact preceding playtest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/WeepingAngeIs/z-UwU_dm/actions/artifacts/14737631439/zip > "$RUNNER_TEMP/previous.zip"
          python3 village-size-check/package.py "$RUNNER_TEMP/previous.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: village-inputs-${{ github.sha }}
          path: build/village-input/
          retention-days: 5
          if-no-files-found: error
  generate:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 84
    strategy:
      fail-fast: false
      matrix:
        seed: [152045, 20261121, 8675309]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: village-inputs-${{ github.sha }}
          path: build/village-input
      - name: Generate Sakura Reach and inspect completed homes and streets
        run: bash village-size-check/run.sh ${{ matrix.seed }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: village-evidence-${{ matrix.seed }}-${{ github.sha }}
          path: build/village-evidence/
          retention-days: 8
          if-no-files-found: ignore
  verified:
    needs: generate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: village-inputs-${{ github.sha }}
          path: build/village-input
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: village-evidence-*-${{ github.sha }}
          path: build/village-evidence
          merge-multiple: true
      - name: Confirm all house counts, upgrade evidence and draw measured layouts
        run: |
          (cd build/village-input && sha256sum -c checksums.txt)
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            https://files.pythonhosted.org/packages/e4/c9/06dd4a38974e24f932ff5f98ea3c546ce3f8c995d3f0985f8e5ba48bba19/pillow-11.3.0-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl \
            --output "$RUNNER_TEMP/village-preview.whl"
          printf '%s  %s\n' 676b2815362456b5b3216b4fd5bd89d362100dc6f4945154ff172e206a22c024 "$RUNNER_TEMP/village-preview.whl" | sha256sum -c
          /usr/bin/python3 -m zipfile -e "$RUNNER_TEMP/village-preview.whl" "$RUNNER_TEMP/village-preview-libs"
          PYTHONPATH="$RUNNER_TEMP/village-preview-libs" /usr/bin/python3 village-size-check/report.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: uwu-village-playtest-${{ github.sha }}
          path: build/village-final/
          retention-days: 14
          if-no-files-found: error
