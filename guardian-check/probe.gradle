gradle.projectsEvaluated {
    def project = gradle.rootProject
    def compile = project.tasks.register('compileGuardianHomeProbe', JavaCompile) {
        source(project.fileTree('guardian-check/java') { include '**/*.java' })
        source(project.fileTree('chest-check/java') { include '**/*.java' })
        source(project.fileTree('toaster-check/java') { include '**/*.java' })
        source(project.fileTree('lantern-check/java') { include '**/*.java' })
        source(project.fileTree('cupid-parity-check/java') { include '**/*.java' })
        def candidate = System.getenv('UWU_CHECK_FROZEN_JAR')
        classpath = project.sourceSets.main.compileClasspath +
                (candidate ? project.files(candidate) : project.sourceSets.main.output)
        destinationDirectory.set(project.layout.buildDirectory.dir('guardian-check/classes'))
        javaCompiler.set(project.tasks.named('compileJava', JavaCompile).flatMap { it.javaCompiler })
        options.release.set(21)
    }
    project.tasks.register('guardianHomeProbeJar', Jar) {
        archiveFileName.set('guardian-home-probe.jar')
        destinationDirectory.set(project.layout.buildDirectory.dir('guardian-check'))
        from(compile.flatMap { it.destinationDirectory })
        from(project.file('guardian-check/resources'))
    }
}
