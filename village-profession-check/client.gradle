gradle.beforeProject { project ->
    project.plugins.withId('net.neoforged.moddev') {
        def probe = project.sourceSets.create('escortPictures')
        probe.java.srcDirs = [project.file('village-profession-check/client/java')]
        probe.resources.srcDirs = [project.file('village-profession-check/client/resources')]
        probe.compileClasspath += project.sourceSets.main.compileClasspath + project.sourceSets.main.output
        project.configurations.getByName(probe.runtimeClasspathConfigurationName)
                .extendsFrom(project.configurations.getByName(project.sourceSets.main.runtimeClasspathConfigurationName))
        def path = System.getenv('UWU_JAR')?.trim()
        def hash = System.getenv('UWU_EXPECTED_JAR_SHA256')?.trim()
        if (!path || !hash?.matches('(?i)[0-9a-f]{64}')) {
            throw new org.gradle.api.GradleException('Dialogue checks require the frozen UWU_JAR and its SHA-256')
        }
        def candidate = project.file(path).canonicalFile
        if (!candidate.isFile()) throw new org.gradle.api.GradleException('Missing packaged candidate ' + candidate)
        def mode = 'gallery'
        project.dependencies.add(probe.runtimeOnlyConfigurationName, project.files(candidate))
        project.dependencies.add(probe.runtimeOnlyConfigurationName,
                project.fileTree('build/escort-deps/' + mode) { include '*.jar' })
        def probeMod = project.neoForge.mods.create('uwu_escort_pictures') { sourceSet(probe) }
        project.neoForge.runs.create('escortGallery') {
            client()
            sourceSet = probe
            loadedMods = [probeMod]
            gameDirectory = project.file('build/escort-' + mode)
            jvmArgument('-Xmx3G')
            jvmArgument('-Duwu.check.candidateJar=' + candidate.absolutePath)
            jvmArgument('-Duwu.check.candidateSha256=' + hash)
            jvmArgument('-Duwu.check.dialogueMode=' + mode)
            jvmArgument('-Duwu.check.evidence=' + project.file('build/profession-evidence/' + mode).absolutePath)
        }
    }
}
